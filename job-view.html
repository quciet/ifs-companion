<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFs job</title><style>
body{font:15px 'Segoe UI',sans-serif;color:#283c34;margin:24px}button,input{font:inherit;padding:9px;border:1px solid #cddbd2;border-radius:7px}button{cursor:pointer;background:#f2f7f4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f6;padding:16px;border-radius:8px;max-height:40vh;overflow:auto}dl{display:grid;grid-template-columns:140px 1fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}#error{color:#a22}#approve{background:#304c3f;color:white}small{color:#65766b}</style></head>
<body><h1 id="title">IFs job</h1><p id="status" role="status"></p><p id="summary"></p><dl id="runStatus"></dl><details id="technical"><summary>Technical details</summary><dl id="details"></dl></details><pre id="content" hidden></pre><div class="actions"><button id="approve" hidden>Approve and run this .sce</button><button id="cancel" hidden>Stop job</button><button id="recover" hidden>Restore working files</button><button id="save" hidden>Save to IFs</button><button id="compare" hidden>Compare this run</button></div><form id="saveForm" hidden><p>Copy the scenario and result to IFs. These copies remain when this task is deleted. Existing files are kept.</p><label>Scenario name <input id="saveName" required maxlength="150"></label> <button type="submit">Save copies</button></form><p id="saved" role="status"></p><details id="logs" hidden><summary>Model log (latest output)</summary><pre id="log"></pre></details><p id="error" role="alert"></p><script src="/job-view.js"></script></body></html>
